modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Shadered+"
description='''Decorative blocks that project a skybox onto their faces using a custom shader, like a window into another sky.

Unofficial: not made by or affiliated with the Shadered mod or its author.'''

[[mixins]]
config="skyblocks.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

# Optional: when Sodium is installed, sky blocks are drawn through its terrain shader too.
[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"
